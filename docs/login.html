<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Portal DG DHL</title>
  <style>
    @font-face {
      font-family: 'Delivery';
      src: url('Delivery_Lt.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Delivery', sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    .login-box {
      width: 340px;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-box img {
      width: 160px;
      margin-bottom: 15px;
    }
    h2 {
      margin-bottom: 20px;
      color: #D40511; /* DHL Red */
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      font-family: 'Delivery', sans-serif;
    }
    button {
      background-color: #FFCC00; /* DHL Yellow */
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Delivery', sans-serif;
      color: #000;
      font-size: 15px;
    }
    button:hover {
      background-color: #e6b800;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
      font-size: 13px;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      text-align: center;
      font-family: 'Delivery', sans-serif;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logo-dhl.png" alt="DHL Logo">
    <h2>Portal DG DHL</h2>
    <form id="dg-login-form">
      <input id="dg-account" type="text" maxlength="9" placeholder="Conta (9 dígitos)" required>
      <input id="dg-pass" type="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p id="dg-login-error" class="error"></p>
    </form>
  </div>

  <footer>
    Exclusivo para Clientes · DHL Express · Mercadorias Perigosas
  </footer>
</body>
</html>
