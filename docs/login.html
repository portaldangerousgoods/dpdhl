<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Portal DG DHL</title>
  <link rel="stylesheet" href="stylesheets/menu-lateral.css">
  <style>
    @font-face {
      font-family: 'Delivery';
      src: url('Delivery_Lt.ttf') format('truetype');
    }

    body {
      font-family: 'Delivery', sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .login-container img {
      max-width: 160px;
      margin-bottom: 15px;
    }

    .login-container h2 {
      color: #D40511; /* DHL Red */
      font-size: 22px;
      margin-bottom: 25px;
    }

    /* ===== Form alinhado + ícones internos ===== */
    .login-container form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .input-wrap {
      position: relative;
      width: 92%;
      max-width: 340px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 12px 12px 44px; /* espaço para o ícone */
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: left;            /* texto alinhado à esquerda (mais natural) */
      box-sizing: border-box;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: .8;
    }

    .login-container input:focus {
      border-color: #FFCC00;
      box-shadow: 0 0 6px rgba(255,204,0,.5);
      outline: none;
    }

    .login-container input::placeholder {
      color: #777;
      font-weight: 400;
    }

    .login-container button {
      width: 92%;
      max-width: 340px;
      background: #FFCC00; /* DHL Yellow */
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
      transition: background .2s ease;
    }

    .login-container button:hover {
      background: #e6b800;
    }

    .error {
      color: #D40511;
      display: none;
      margin-top: 6px;
      font-size: 14px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <img src="logo-dhl.png" alt="Logo DHL">
    <h2>Portal Dangerous Goods 🔥</h2>

    <form id="dg-login-form">
      <!-- Campo Conta com ícone de usuário -->
      <div class="input-wrap">
        <!-- ícone usuário (SVG preto) -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Z" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 22c0-3.866 4.477-7 9-7s9 3.134 9 7" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="text" id="dg-account" maxlength="9" placeholder="Conta (9 dígitos)">
      </div>

      <!-- Campo Senha com ícone de cadeado -->
      <div class="input-wrap">
        <!-- ícone cadeado (SVG preto) -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 10V7a5 5 0 0 1 10 0v3" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="10" width="16" height="10" rx="2" stroke="#000" stroke-width="1.8"/>
          <circle cx="12" cy="15" r="1.5" fill="#000"/>
        </svg>
        <input type="password" id="dg-pass" placeholder="Senha">
      </div>

      <button type="submit">Entrar</button>
      <p id="dg-login-error" class="error"></p>
    </form>

    <footer>Exclusivo para Clientes · DHL Express · Mercadorias Perigosas</footer>
  </div>

  <script>
    (function () {
      function basePath() {
        const parts = location.pathname.split('/').filter(Boolean);
        return parts.length ? `/${parts[0]}/` : '/';
      }
      function setAuthOk() {
        const exp = Date.now() + 8 * 60 * 60 * 1000; // 8h
        localStorage.setItem('dg_auth', JSON.stringify({ ok: true, exp }));
      }

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('dg-login-form');
        const accountInput = document.getElementById('dg-account');
        const passInput = document.getElementById('dg-pass');
        const errorBox = document.getElementById('dg-login-error');

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const account = (accountInput.value || '').trim();
          const pass = (passInput.value || '').trim();

          const isNineDigits = /^[0-9]{9}$/.test(account);
          const okPass = pass === 'dhl1234!';

          if (!isNineDigits) {
            errorBox.textContent = 'A conta deve ter exatamente 9 dígitos numéricos.';
            errorBox.style.display = 'block';
            return;
          }
          if (!okPass) {
            errorBox.textContent = 'Senha inválida.';
            errorBox.style.display = 'block';
            return;
          }

          setAuthOk();
          window.location.replace(basePath());
        });
      });
    })();
  </script>
</body>
</html>
