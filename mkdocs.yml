site_name: Portal DG DHL
site_url: https://portaldangerousgoods.github.io/dpdhl/
repo_url: https://github.com/portaldangerousgoods/dpdhl
repo_name: GitHub

theme:
  name: material
  language: pt-BR

  logo: logo-dhl.png

  palette:
    - scheme: default
      primary: yellow
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Claro
        color: '#FFCC00'
    - scheme: slate
      primary: yellow
      accent: red
      toggle:
        icon: material/weather-night
        name: Escuro
        color: '#FFCC00'

  font:
    text: "Barlow"
    code: "Fira Code"

nav:
  - Início: index.md
  - FAQ Técnico: faq.md
  - Como aprovar uma conta: aprovacao.md
  - Documentos exigidos: documentos.md
  - Produtos Biológicos: biologicos.md
  - Transporte de Gelo Seco: gelo-seco.md

extra_javascript:
  - extra.js

extra_css:
  - extra.css

extra_css:
  - overrides/stylesheets/extra.css
