site_name: Portal DG DHL
site_url: https://portaldangerousgoods.github.io/dpdhl/
repo_url: https://github.com/portaldangerousgoods/dpdhl
repo_name: GitHub

theme:
  name: material
  language: pt-BR

  # Estilo visual com identidade DHL
  palette:
    - scheme: default
      primary: yellow
      accent: red

  # Logo personalizado (imagem salva como docslogo.png)
  logo: docslogo.png

  # Fonte moderna e forte estilo delivery/logística
  font:
    text: "Barlow"
    code: "Fira Code"

nav:
  - Início: index.md
  - Como aprovar uma conta: aprovacao.md
  - Documentos exigidos: documentos.md
  - FAQ Técnico: faq.md
